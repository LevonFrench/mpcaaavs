<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self'; style-src 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; frame-src 'none'">
<title>MPC-AAAVS</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#ccc;font:12px 'Segoe UI',sans-serif}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#preset,#status{position:absolute;left:12px;bottom:10px;max-width:90%;padding:4px 8px;background:#181818b0;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timing{position:absolute;right:12px;top:10px;padding:4px 8px;background:#181818b0;pointer-events:none;opacity:0;transition:opacity .2s}
body.protection-error #status,body:focus-within #preset,body:focus-within #timing,body:hover #status,body.announce #status,body:hover #preset,body.announce #preset,body:hover #timing,body.announce #timing{opacity:1}
#status{bottom:38px}
body.bootstrap-error #preset,body.bootstrap-error #status{opacity:1;white-space:normal;overflow-wrap:anywhere}
body.bootstrap-error #preset{bottom:auto;top:12px}
body.bootstrap-error #status{bottom:auto;top:60px}
#retry{position:absolute;left:12px;bottom:12px;padding:8px 12px;font:inherit}
#retry:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style></head><body><canvas id="visualizer" tabindex="0" aria-label="Music visualizer. Press Shift F10 for visualizer options."></canvas><div id="timing"></div><div id="preset">Starting AAAVS…</div><div id="status" role="status" aria-live="polite"></div><script type="module" src="dist/mpc-host.js"></script></body></html>
